name: Scheduled maintenance

# Daily: health check (also keeps a Supabase Free project from pausing for
# inactivity) and a retry of failed lead notification emails.
# Configure in GitHub → Settings → Secrets and variables → Actions:
#   variable SITE_URL   e.g. https://devmsr.in
#   secret   CRON_SECRET (same value as the Worker secret)
on:
  schedule:
    - cron: '30 3 * * *' # 09:00 IST
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: ${{ vars.SITE_URL != '' }}
    steps:
      - name: Health check
        run: curl --fail --silent --show-error --max-time 30 "${{ vars.SITE_URL }}/api/health"
      - name: Retry failed notifications
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        if: ${{ env.CRON_SECRET != '' }}
        run: |
          curl --fail --silent --show-error --max-time 60 -X POST \
            -H "Authorization: Bearer $CRON_SECRET" \
            "${{ vars.SITE_URL }}/api/cron/retry-notifications"
