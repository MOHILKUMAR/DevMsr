name: CI

on:
  push:
    branches: [main, 'feat/**']
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Type check
        run: npm run check
      - name: Seed is up to date with src/data
        run: |
          npm run seed:generate
          git diff --exit-code supabase/seed.sql
      - name: Unit and database (PGlite + RLS) tests
        run: npm test
      - name: Production build
        run: npm run build
      - name: Secret scan of browser assets
        run: npm run check:secrets
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: End-to-end tests (workerd preview)
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: test-results
          retention-days: 7
